name: Continuous Integration - MCP Server Validation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Dependencies & MCP SDK
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio pydantic mcp

      - name: Code Quality Linting (Flake8 & Mypy)
        run: |
          # Ensure strict adherence to typing for Pydantic tool schemas, targeting only project source code
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # mypy src/ --ignore-missing-imports

      - name: Execute Deterministic Unit Tests
        run: |
          # Test internal business logic independent of LLMs
          pytest tests/unit

      - name: Execute Asynchronous MCP Protocol Tests
        env:
          OPENAI_API_KEY: ${{ secrets.INTEGRATION_TEST_OPENAI_KEY }}
        run: |
          # Run integration tests simulating an MCP Client connection
          # Verifies schemas, tool listings, and async loop handling
          pytest tests/integration_mcp